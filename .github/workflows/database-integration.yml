name: Database integration
on:
  pull_request:
  push:
    branches: [main]
jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: laostravel
          POSTGRES_PASSWORD: test
          POSTGRES_DB: laostravel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U laostravel -d laostravel_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://laostravel:test@localhost:5432/laostravel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies for production mutation tests
        run: npm ci --no-audit --no-fund
      - name: Bootstrap fresh database
        run: node scripts/run-db-bootstrap.mjs
      - name: Exercise production lifecycle and reward mutations
        run: RUN_DB_MUTATION_TESTS=1 npx vitest run db/integration/production-mutations.test.ts
      - name: Run SQL integration checks
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/integration/001_commercial_path.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/integration/002_trial_ordinals.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/integration/003_quote_replay_rollback.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/integration/004_idempotent_retry.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/integration/005_quote_service_availability.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/integration/005_tour_lead_idempotency.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/integration/006_tour_lead_rate_limit.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/integration/008_booking_trial_rollback.sql
      - name: Run booking trial E2E
        run: |
          echo "::group::007_booking_trial_e2e.sql"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v VERBOSITY=verbose -f db/integration/007_booking_trial_e2e.sql
          echo "::endgroup::"
      - name: Run concurrency invariants
        run: node scripts/run-db-concurrency.mjs
